services:
  db:
    image: postgres:16-alpine
    container_name: astra-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-astra_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-astra}

    volumes:
      - astra_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile

    container_name: astra-backend
    restart: unless-stopped

    env_file:
      - Backend/.env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: astra-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

volumes:
  astra_postgres_data: